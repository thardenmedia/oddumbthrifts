<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#EDE4CE" />
<title>Oddumbthrifts Tracker</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="app">

  <!-- ===== AUTH ===== -->
  <div id="auth-screen" class="auth-screen hidden">
    <div class="auth-hero">
      <div class="tag-string"></div>
      <div class="tag">
        <h1 class="marker">Oddumbthrifts</h1>
        <p>Sales &amp; Expense Tracker</p>
      </div>
    </div>

    <form id="auth-form" class="auth-form">
      <div id="auth-error" class="auth-error hidden"></div>
      <div class="field">
        <label for="auth-email">Email</label>
        <input id="auth-email" type="email" autocomplete="email" required />
      </div>
      <div class="field">
        <label for="auth-password">Password</label>
        <input id="auth-password" type="password" autocomplete="current-password" required minlength="6" />
      </div>
      <button type="submit" id="auth-submit" class="btn btn-primary btn-full">Log In</button>
    </form>

    <div class="auth-switch">
      <span id="auth-switch-text">New here?</span>
      <button type="button" id="auth-switch-btn">Create an account</button>
    </div>
  </div>

  <!-- ===== MAIN APP ===== -->
  <div id="main-app" class="hidden" style="display:flex; flex-direction:column; min-height:100vh;">
    <div class="app-header">
      <div class="brand marker">Oddumbthrifts</div>
      <button id="logout-btn" class="icon-btn" title="Log out" aria-label="Log out">&#8594;|</button>
    </div>

    <!-- Dashboard -->
    <div id="view-dashboard" class="view">
      <div class="month-switcher">
        <button id="month-prev" aria-label="Previous month">&#8592;</button>
        <div id="month-label" class="month-label">—</div>
        <button id="month-next" aria-label="Next month">&#8594;</button>
      </div>

      <div class="hero-tag">
        <div class="label">Net Profit</div>
        <div id="hero-profit" class="value marker mono">$0.00</div>
        <div id="hero-sub" class="sub">0% margin · $0.00 avg / item</div>
      </div>

      <div class="stat-grid">
        <div class="stat-tag"><div class="stat-label">Items Sold</div><div id="stat-sold" class="stat-value mono">0</div></div>
        <div class="stat-tag"><div class="stat-label">Currently Listed</div><div id="stat-listed" class="stat-value mono">0</div></div>
        <div class="stat-tag"><div class="stat-label">Revenue</div><div id="stat-revenue" class="stat-value mono">$0</div></div>
        <div class="stat-tag"><div class="stat-label">Cost of Goods</div><div id="stat-cogs" class="stat-value mono">$0</div></div>
        <div class="stat-tag"><div class="stat-label">Fees + Shipping</div><div id="stat-fees" class="stat-value mono">$0</div></div>
        <div class="stat-tag"><div class="stat-label">Other Expenses</div><div id="stat-expenses" class="stat-value mono">$0</div></div>
      </div>

      <div class="section-title">By Month</div>
      <div id="month-table" class="month-table"></div>
    </div>

    <!-- Items -->
    <div id="view-items" class="view hidden">
      <div class="filter-row">
        <button class="filter-chip active" data-filter="All">All</button>
        <button class="filter-chip" data-filter="Listed">Listed</button>
        <button class="filter-chip" data-filter="Sold">Sold</button>
      </div>
      <div id="items-list"></div>
    </div>

    <!-- Expenses -->
    <div id="view-expenses" class="view hidden">
      <div id="expenses-list"></div>
    </div>

    <button id="fab" class="fab" aria-label="Add">+</button>

    <div class="bottom-nav">
      <button class="nav-btn active" data-view="dashboard">
        <span class="nav-icon">&#9737;</span><span>Dashboard</span>
      </button>
      <button class="nav-btn" data-view="items">
        <span class="nav-icon">&#128717;</span><span>Items</span>
      </button>
      <button class="nav-btn" data-view="expenses">
        <span class="nav-icon">&#128176;</span><span>Expenses</span>
      </button>
    </div>
  </div>

  <!-- ===== ITEM FORM SHEET ===== -->
  <div id="item-sheet-backdrop" class="sheet-backdrop hidden">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <h2 id="item-sheet-title" class="sheet-title marker">Add Item</h2>
      <form id="item-form" class="form-grid">
        <input type="hidden" id="item-id" />

        <div class="field">
          <label for="item-desc">Item description</label>
          <input id="item-desc" type="text" required placeholder="e.g. Levi shorts" />
        </div>

        <div class="form-row-2">
          <div class="field">
            <label for="item-category">Category</label>
            <select id="item-category">
              <option>Tops</option><option>Bottoms</option><option>Dresses</option>
              <option>Outerwear</option><option>Shoes</option><option>Accessories</option>
              <option>Other</option>
            </select>
          </div>
          <div class="field">
            <label for="item-platform">Platform</label>
            <select id="item-platform">
              <option>Depop</option><option>Vinted</option><option>Marketplace</option><option>Other</option>
            </select>
          </div>
        </div>

        <div class="form-row-2">
          <div class="field">
            <label for="item-cost">Cost</label>
            <input id="item-cost" type="number" step="0.01" min="0" value="0" />
          </div>
          <div class="field">
            <label for="item-date-acquired">Date acquired</label>
            <input id="item-date-acquired" type="date" />
          </div>
        </div>

        <div class="field">
          <label for="item-date-listed">Date listed</label>
          <input id="item-date-listed" type="date" required />
        </div>

        <div class="field" style="flex-direction:row; align-items:center; display:flex; gap:8px;">
          <input type="checkbox" id="item-sold-toggle" style="width:18px; height:18px;" />
          <label for="item-sold-toggle" style="margin:0;">This item has sold</label>
        </div>

        <!-- Sold-only fields -->
        <div id="sold-fields" class="form-grid hidden">
          <div class="section-title" style="margin-top:6px;">Sale details</div>
          <div class="form-row-2">
            <div class="field">
              <label for="item-date-sold">Date sold</label>
              <input id="item-date-sold" type="date" />
            </div>
            <div class="field">
              <label for="item-sale-price">Sale price</label>
              <input id="item-sale-price" type="number" step="0.01" min="0" />
            </div>
          </div>
          <div class="form-row-2">
            <div class="field">
              <label for="item-platform-fee">Platform fee</label>
              <input id="item-platform-fee" type="number" step="0.01" min="0" value="0" />
            </div>
            <div class="field">
              <label for="item-shipping">Shipping cost</label>
              <input id="item-shipping" type="number" step="0.01" min="0" value="0" />
            </div>
          </div>
        </div>

        <div id="item-error" class="auth-error hidden"></div>

        <div class="sheet-actions">
          <button type="button" id="item-cancel-btn" class="btn btn-ghost">Cancel</button>
          <button type="submit" id="item-save-btn" class="btn btn-primary">Save</button>
        </div>
        <button type="button" id="item-delete-btn" class="btn btn-danger btn-full hidden">Delete Item</button>
      </form>
    </div>
  </div>

  <!-- ===== EXPENSE FORM SHEET ===== -->
  <div id="expense-sheet-backdrop" class="sheet-backdrop hidden">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <h2 id="expense-sheet-title" class="sheet-title marker">Add Expense</h2>
      <form id="expense-form" class="form-grid">
        <input type="hidden" id="expense-id" />

        <div class="form-row-2">
          <div class="field">
            <label for="expense-date">Date</label>
            <input id="expense-date" type="date" required />
          </div>
          <div class="field">
            <label for="expense-category">Category</label>
            <select id="expense-category">
              <option>Supplies</option><option>Shipping Supplies</option>
              <option>Marketing</option><option>Subscriptions</option>
              <option>Sourcing Trip</option><option>Mileage</option><option>Other</option>
            </select>
          </div>
        </div>

        <div class="field">
          <label for="expense-desc">Description</label>
          <input id="expense-desc" type="text" placeholder="e.g. Poly mailers" />
        </div>

        <div class="field">
          <label for="expense-amount">Amount</label>
          <input id="expense-amount" type="number" step="0.01" min="0" required />
        </div>

        <div id="expense-error" class="auth-error hidden"></div>

        <div class="sheet-actions">
          <button type="button" id="expense-cancel-btn" class="btn btn-ghost">Cancel</button>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
        <button type="button" id="expense-delete-btn" class="btn btn-danger btn-full hidden">Delete Expense</button>
      </form>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

</div>

<script type="module" src="app.js"></script>
</body>
</html>
